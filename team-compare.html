<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마케팅팀 역량 비교 점검</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --primary: #6C63FF;
    --primary-dark: #5a52d5;
    --accent: #FF6584;
    --success: #43D39E;
    --warning: #FFB347;
    --gold: #FFD700;
    --bg: #F5F5FA;
    --bg2: #EEEEF8;
    --bg3: #E8E8F5;
    --card: #FFFFFF;
    --border: #CCCCDD;
    --text: #1A1A2E;
    --text-muted: #555577;
    --self-color: #6C63FF;
    --lead-color: #FF6584;
    --gap-pos: #43D39E;
    --gap-neg: #FF6584;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; min-height: 100vh; }

  /* ── Header ── */
  .header {
    background: linear-gradient(135deg, #1A1A2E, #2D2B55);
    padding: 24px 32px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
  }
  .header-left h1 { font-size: 1.3rem; color: #fff; font-weight: 700; }
  .header-left p { color: rgba(255,255,255,0.6); font-size: 0.82rem; margin-top: 3px; }
  .header-badges { display: flex; gap: 8px; flex-wrap: wrap; }
  .badge { padding: 4px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
  .badge-self { background: rgba(108,99,255,0.25); color: #a89fff; border: 1px solid rgba(108,99,255,0.4); }
  .badge-lead { background: rgba(255,101,132,0.2); color: #ff9aad; border: 1px solid rgba(255,101,132,0.4); }

  /* ── Layout ── */
  .container { max-width: 1100px; margin: 0 auto; padding: 28px 20px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  @media (max-width: 700px) {
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
  }

  /* ── Filter bar ── */
  .filter-bar {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 24px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .filter-bar label { font-size: 0.82rem; color: var(--text-muted); font-weight: 600; white-space: nowrap; }
  .filter-bar select, .filter-bar input {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.88rem;
    color: var(--text);
    background: var(--bg);
    min-width: 140px;
  }
  .filter-bar select:focus, .filter-bar input:focus { outline: 2px solid var(--primary); border-color: transparent; }
  .btn { padding: 9px 22px; border-radius: 8px; font-size: 0.88rem; font-weight: 700; cursor: pointer; border: none; transition: all .15s; }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-secondary { background: var(--bg2); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { background: var(--bg3); }

  /* ── Section card ── */
  .section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .section-title {
    font-size: 0.95rem; font-weight: 700; color: var(--primary);
    margin-bottom: 18px;
    padding-bottom: 12px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
  }
  .section-title .tag {
    margin-left: auto;
    font-size: 0.72rem; font-weight: 600;
    background: var(--bg2); color: var(--text-muted);
    padding: 3px 10px; border-radius: 10px;
  }

  /* ── Identity card (top info) ── */
  .identity-card {
    display: flex; flex-direction: column; gap: 8px;
  }
  .info-row { display: flex; gap: 8px; align-items: baseline; }
  .info-label { font-size: 0.75rem; color: var(--text-muted); min-width: 56px; }
  .info-value { font-size: 0.9rem; font-weight: 600; }
  .workload-chip {
    display: inline-block; padding: 2px 10px; border-radius: 10px;
    font-size: 0.78rem; font-weight: 700;
    background: var(--bg2); color: var(--primary);
  }

  /* ── Review text comparison ── */
  .review-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
  @media (max-width: 600px) { .review-pair { grid-template-columns: 1fr; } }
  .review-col { }
  .review-who {
    font-size: 0.75rem; font-weight: 700; margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot-self { background: var(--self-color); }
  .dot-lead { background: var(--lead-color); }
  .review-text {
    background: var(--bg);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 0.84rem;
    color: var(--text);
    line-height: 1.65;
    min-height: 60px;
    border: 1px solid var(--border);
  }
  .review-subhead {
    font-size: 0.78rem; font-weight: 700; color: var(--text-muted);
    margin: 14px 0 8px;
  }

  /* ── Stat comparison rows ── */
  .stat-compare-row {
    display: grid;
    grid-template-columns: 70px 1fr 52px 52px 52px;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    font-size: 0.85rem;
  }
  .stat-name { font-weight: 600; font-size: 0.82rem; color: var(--text-muted); }
  .bar-wrap { position: relative; height: 10px; background: var(--bg2); border-radius: 5px; overflow: visible; }
  .bar-self {
    height: 10px; border-radius: 5px 0 0 5px;
    background: linear-gradient(90deg, var(--self-color), #a89fff);
    position: absolute; top: 0; left: 0;
    transition: width .4s;
  }
  .bar-lead-line {
    position: absolute; top: -3px;
    width: 3px; height: 16px; border-radius: 2px;
    background: var(--lead-color);
    transition: left .4s;
  }
  .val-self { text-align: center; font-weight: 700; color: var(--self-color); }
  .val-lead { text-align: center; font-weight: 700; color: var(--lead-color); }
  .val-gap {
    text-align: center; font-weight: 700; font-size: 0.8rem;
    border-radius: 6px; padding: 2px 6px;
  }
  .gap-pos { color: var(--gap-pos); background: rgba(67,211,158,0.1); }
  .gap-neg { color: var(--gap-neg); background: rgba(255,101,132,0.1); }
  .gap-zero { color: var(--text-muted); background: var(--bg2); }

  /* ── Stat header ── */
  .stat-header {
    display: grid;
    grid-template-columns: 70px 1fr 52px 52px 52px;
    gap: 10px;
    margin-bottom: 10px;
    font-size: 0.72rem; color: var(--text-muted); font-weight: 600;
    text-align: center;
  }
  .stat-header .sh-left { text-align: left; }

  /* ── Skill comparison table ── */
  .skill-table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
  .skill-table th {
    background: var(--bg2); color: var(--text-muted);
    font-size: 0.75rem; font-weight: 700;
    padding: 8px 12px; text-align: left;
    border-bottom: 2px solid var(--border);
  }
  .skill-table th:not(:first-child) { text-align: center; }
  .skill-table td { padding: 9px 12px; border-bottom: 1px solid var(--bg2); }
  .skill-table td:not(:first-child) { text-align: center; }
  .skill-table tr:last-child td { border-bottom: none; }
  .lv-chip {
    display: inline-block;
    padding: 2px 10px; border-radius: 10px;
    font-size: 0.78rem; font-weight: 700;
  }
  .lv-0 { background: #f0f0f0; color: #999; }
  .lv-1 { background: #e8e8ff; color: #7070cc; }
  .lv-2 { background: #d0d0ff; color: #5050bb; }
  .lv-3 { background: #b8b0ff; color: #3a2e9c; }
  .lv-4 { background: rgba(108,99,255,0.25); color: #4a3fcc; }
  .lv-5 { background: var(--gold); color: #5a4000; }

  /* ── KPI table ── */
  .kpi-table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
  .kpi-table th {
    background: var(--bg2); color: var(--text-muted);
    font-size: 0.75rem; font-weight: 700;
    padding: 8px 12px; text-align: left;
    border-bottom: 2px solid var(--border);
  }
  .kpi-table td { padding: 9px 12px; border-bottom: 1px solid var(--bg2); }
  .kpi-table tr:last-child td { border-bottom: none; }

  /* ── Retro items ── */
  .retro-block { margin-bottom: 14px; }
  .retro-label {
    font-size: 0.75rem; font-weight: 700; color: var(--primary);
    margin-bottom: 5px;
  }
  .retro-text {
    background: var(--bg);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.84rem;
    line-height: 1.65;
    border: 1px solid var(--border);
    color: var(--text);
  }

  /* ── Radar chart ── */
  .chart-wrap { position: relative; width: 100%; max-width: 360px; margin: 0 auto; }
  .chart-legend { display: flex; justify-content: center; gap: 20px; margin-top: 10px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: var(--text-muted); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

  /* ── Summary score card ── */
  .score-cards { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }
  .score-card {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 18px;
    text-align: center; min-width: 100px;
  }
  .score-card .sc-label { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 4px; }
  .score-card .sc-value { font-size: 1.5rem; font-weight: 800; }
  .sc-self { color: var(--self-color); }
  .sc-lead { color: var(--lead-color); }
  .sc-gap { color: var(--text-muted); }

  /* ── State messages ── */
  .empty-state {
    text-align: center; padding: 50px 20px;
    color: var(--text-muted); font-size: 0.9rem;
  }
  .empty-state .emoji { font-size: 2.5rem; margin-bottom: 12px; }
  .loading {
    text-align: center; padding: 40px;
    color: var(--text-muted);
  }
  .error-msg {
    background: rgba(255,101,132,0.08);
    border: 1px solid rgba(255,101,132,0.3);
    border-radius: 8px; padding: 14px 18px;
    color: var(--accent); font-size: 0.85rem;
    margin-bottom: 16px;
  }

  /* ── Month chip selector ── */
  .month-chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .month-chip {
    padding: 5px 14px; border-radius: 20px;
    font-size: 0.8rem; font-weight: 600;
    background: var(--bg2); color: var(--text-muted);
    cursor: pointer; border: 1px solid var(--border);
    transition: all .15s;
  }
  .month-chip.active {
    background: var(--primary); color: white; border-color: var(--primary);
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>🔍 마케팅팀 역량 비교 점검</h1>
    <p>Self 리뷰 × Lead 리뷰 통합 분석</p>
  </div>
  <div class="header-badges">
    <span class="badge badge-self">● Self (팀원)</span>
    <span class="badge badge-lead">● Lead (팀장)</span>
  </div>
</div>

<div class="container">

  <!-- Filter bar -->
  <div class="filter-bar">
    <label>팀원</label>
    <select id="filterMember">
      <option value="">전체</option>
    </select>
    <label>기준월</label>
    <select id="filterMonth">
      <option value="">전체</option>
    </select>
    <button class="btn btn-primary" onclick="loadData()">🔄 불러오기</button>
    <button class="btn btn-secondary" onclick="resetFilter()">초기화</button>
    <span id="statusMsg" style="margin-left:auto;font-size:0.8rem;color:var(--text-muted);"></span>
  </div>

  <!-- Main content -->
  <div id="mainContent">
    <div class="empty-state">
      <div class="emoji">📂</div>
      <div>팀원과 기준월을 선택하고 <strong>불러오기</strong>를 눌러주세요</div>
      <div style="margin-top:8px;font-size:0.8rem">Notion DB에서 해당 회고 데이터를 가져옵니다</div>

</div>

<script>
// ─────────────────────────────────────────────
// CONFIG — Notion DB 조회용 Make.com Webhook
// team-review.html의 Webhook과 별개로,
// DB 조회 전용 Make.com 시나리오 Webhook URL을 아래에 입력
// ─────────────────────────────────────────────

// Notion DB 데이터를 직접 조회할 수 없으므로
// 대안: 로컬 데이터 입력 방식 + Make.com 조회 Webhook 방식 선택 가능
// 아래 DEMO_DATA는 실제 테스트용 샘플 데이터 (Notion 연결 전 미리보기용)

    'review-self-skills-s8': 1,

    'review-lead-skills-s2': 2,
    'review-lead-skills-s3': 2,
    'review-lead-skills-s4': 3,
    'review-lead-skills-s5': 3,
    'review-lead-skills-s6': 3,
    'review-lead-skills-s7': 2,
    'review-lead-skills-s8': 2,
    'kpi-name-1': '월 매출 ROAS', 'kpi-target-1': '200%', 'kpi-actual-1': '185%',
    'kpi-name-2': '신규 고객 전환율', 'kpi-target-2': '3.5%', 'kpi-actual-2': '3.8%',
    'kpi-name-3': '콘텐츠 발행 수', 'kpi-target-3': '20건', 'kpi-actual-3': '18건',

    'archive-collaboration': '신규 팀원 온보딩을 도우며 업무 매뉴얼 작성에 기여했습니다.',
    'archive-wins': '10월 프로모션 캠페인에서 신규 고객 전환율 목표 초과 달성',

    'archive-feedback': '회의 시간 효율화가 필요합니다. 안건 사전 공유 문화가 정착되면 좋겠습니다.',
    'archive-next': '네이버 브랜드 스토어 CRM 세그먼트 구축에 집중할 계획입니다.',

const STATS = [
  { key: 'STR', label: '실행력 STR' },
  { key: 'AGI', label: '민첩성 AGI' },
  { key: 'SEN', label: '감수성 SEN' },
  { key: 'INT', label: '분석력 INT' },
  { key: 'CHA', label: '소통력 CHA' },
  { key: 'STA', label: '지속력 STA' },
];

const SKILLS = [
  { key: 's1', label: 'AI 마케팅 툴 활용' },
  { key: 's2', label: '수익 구조 이해' },
  { key: 's3', label: '프로모션 기획' },
  { key: 's4', label: '매체 운영' },
  { key: 's5', label: '데이터 시각화' },
  { key: 's6', label: '콘텐츠 제작' },
  { key: 's7', label: 'CRM 운영' },
  { key: 's8', label: '브랜드 캠페인' },
];

const SKILL_LEVELS = ['Lv.0 모름', 'Lv.1 개념이해', 'Lv.2 보조수행', 'Lv.3 단독수행', 'Lv.4 최적화', 'Lv.5 가르침'];

let allData = [];
let radarChart = null;

// ── 초기 데이터 로드 (데모 데이터로 드롭다운 채우기) ──
window.onload = function() {
  // 데모 데이터 기반 필터 채우기
  populateFilters(DEMO_DATA);
  setStatus('데모 데이터 로드됨 · Notion 연결 시 실제 데이터로 교체됩니다');
};

function populateFilters(data) {
  const members = [...new Set(data.map(d => d['archive-member']))].filter(Boolean);
  const months = [...new Set(data.map(d => d['archive-month']))].filter(Boolean).sort().reverse();

  const mSel = document.getElementById('filterMember');
  const moSel = document.getElementById('filterMonth');

  // 중복 제거 후 추가
  members.forEach(m => {
    if (![...mSel.options].find(o => o.value === m)) {
      const opt = document.createElement('option');
      opt.value = m; opt.textContent = m;
      mSel.appendChild(opt);
    }
  });
  months.forEach(m => {
    if (![...moSel.options].find(o => o.value === m)) {
      const opt = document.createElement('option');
      opt.value = m; opt.textContent = m;
      moSel.appendChild(opt);
    }
  });

  allData = data;
}

function setStatus(msg) {
  document.getElementById('statusMsg').textContent = msg;
}

function resetFilter() {
  document.getElementById('filterMember').value = '';
  document.getElementById('filterMonth').value = '';
  document.getElementById('mainContent').innerHTML = `
    <div class="empty-state">
      <div class="emoji">📂</div>
      <div>팀원과 기준월을 선택하고 <strong>불러오기</strong>를 눌러주세요</div>
    </div>`;
  setStatus('');
}

async function loadData() {
  const member = document.getElementById('filterMember').value;
  const month = document.getElementById('filterMonth').value;

  if (!member && !month) {
    renderAll(allData);
    return;
  }

  let filtered = allData.filter(d => {
    const mOk = !member || d['archive-member'] === member;
    const moOk = !month || d['archive-month'] === month;
    return mOk && moOk;
  });

  // Notion Webhook 연결 시 여기서 실제 조회
  // 현재는 데모 데이터에서 필터링
  if (filtered.length === 0) {
    document.getElementById('mainContent').innerHTML = `
      <div class="empty-state">
        <div class="emoji">🔍</div>
        <div>해당 조건의 데이터가 없습니다</div>
        <div style="margin-top:8px;font-size:0.8rem">폼에서 제출된 회고 데이터만 조회됩니다</div>
      </div>`;
    return;
  }

  if (filtered.length === 1) {
    renderSingleRecord(filtered[0]);
  } else {
    renderAll(filtered);
  }
  setStatus(`${filtered.length}건 조회됨`);
}

// ── 단일 레코드 상세 뷰 ──
function renderSingleRecord(d) {
  const selfAvg = STATS.reduce((s, st) => s + Number(d[`review-self-stats-${st.key}`] || 0), 0) / STATS.length;
  const leadAvg = STATS.reduce((s, st) => s + Number(d[`review-lead-stats-${st.key}`] || 0), 0) / STATS.length;
  const gapAvg = selfAvg - leadAvg;

  const html = `
    <!-- Top summary -->
    <div class="section">
      <div class="section-title">📋 기본 정보 <span class="tag">${d['archive-month']}</span></div>
      <div class="grid-2">
        <div class="identity-card">
          <div class="info-row"><span class="info-label">팀원</span><span class="info-value">${d['archive-member'] || '-'}</span></div>
          <div class="info-row"><span class="info-label">작성자</span><span class="info-value">${d['archive-author'] || '-'}</span></div>
          <div class="info-row"><span class="info-label">업무강도</span><span class="info-value"><span class="workload-chip">${d['archive-workload'] || '-'}</span></span></div>
          <div class="info-row"><span class="info-label">제출일시</span><span class="info-value" style="font-size:0.82rem;color:var(--text-muted)">${d['submitted-at'] || '-'}</span></div>
        </div>
        <div class="score-cards">
          <div class="score-card">
            <div class="sc-label">Self 평균</div>
            <div class="sc-value sc-self">${selfAvg.toFixed(1)}</div>
          </div>
          <div class="score-card">
            <div class="sc-label">Lead 평균</div>
            <div class="sc-value sc-lead">${leadAvg.toFixed(1)}</div>
          </div>
          <div class="score-card">
            <div class="sc-label">Self−Lead</div>
            <div class="sc-value sc-gap" style="color:${gapAvg > 0.5 ? 'var(--gap-neg)' : gapAvg < -0.5 ? 'var(--gap-pos)' : 'var(--text-muted)'}">${gapAvg > 0 ? '+' : ''}${gapAvg.toFixed(1)}</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 서로의 시선 -->
    <div class="section">
      <div class="section-title">🪞 서로의 시선 — Self vs Lead</div>
      <div class="review-subhead">💪 강점</div>
      <div class="review-pair">
        <div class="review-col">
          <div class="review-who"><span class="dot dot-self"></span>Self — ${d['review-self-name'] || d['archive-member']}</div>
          <div class="review-text">${d['review-self-strength'] || '—'}</div>
        </div>
        <div class="review-col">
          <div class="review-who"><span class="dot dot-lead"></span>Lead — ${d['review-lead-name'] || d['archive-author']}</div>
          <div class="review-text">${d['review-lead-strength'] || '—'}</div>
        </div>
      </div>
      <div class="review-subhead">🌱 성장 포인트</div>
      <div class="review-pair">
        <div class="review-col">
          <div class="review-who"><span class="dot dot-self"></span>Self</div>
          <div class="review-text">${d['review-self-growth'] || '—'}</div>
        </div>
        <div class="review-col">
          <div class="review-who"><span class="dot dot-lead"></span>Lead</div>
          <div class="review-text">${d['review-lead-growth'] || '—'}</div>
        </div>
      </div>
    </div>

    <!-- 6대 스탯 비교 -->
    <div class="section">
      <div class="section-title">⚔️ 6대 스탯 비교</div>
      <div class="grid-2" style="align-items:start">
        <div>
          <div class="stat-header">
            <span class="sh-left">스탯</span>
            <span style="text-align:left">Self ─── Lead</span>
            <span>Self</span>
            <span>Lead</span>
            <span>GAP</span>
          </div>
          ${STATS.map(st => {
            const sv = Number(d[`review-self-stats-${st.key}`] || 0);
            const lv = Number(d[`review-lead-stats-${st.key}`] || 0);
            const gap = sv - lv;
            const gapClass = gap > 0 ? 'gap-pos' : gap < 0 ? 'gap-neg' : 'gap-zero';
            const gapStr = gap > 0 ? `+${gap}` : `${gap}`;
            return `
              <div class="stat-compare-row">
                <div class="stat-name">${st.key}</div>
                <div class="bar-wrap">
                  <div class="bar-self" style="width:${sv * 10}%"></div>
                  <div class="bar-lead-line" style="left:calc(${lv * 10}% - 1.5px)"></div>
                </div>
                <div class="val-self">${sv}</div>
                <div class="val-lead">${lv}</div>
                <div class="val-gap ${gapClass}">${gapStr}</div>
              </div>`;
          }).join('')}
          <div style="font-size:0.72rem;color:var(--text-muted);margin-top:8px">
            <span style="display:inline-flex;align-items:center;gap:4px;margin-right:12px">
              <span style="width:12px;height:4px;background:var(--self-color);border-radius:2px;display:inline-block"></span> Self 바
            </span>
            <span style="display:inline-flex;align-items:center;gap:4px">
              <span style="width:3px;height:12px;background:var(--lead-color);border-radius:1px;display:inline-block"></span> Lead 마커
            </span>
          </div>
        </div>
        <div>
          <div class="chart-wrap">
            <canvas id="radarCanvas" width="320" height="280"></canvas>
          </div>
          <div class="chart-legend">
            <div class="legend-item"><div class="legend-dot" style="background:var(--self-color)"></div>Self</div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--lead-color)"></div>Lead</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 스킬 비교 -->
    <div class="section">
      <div class="section-title">🛠️ 스킬 레벨 비교</div>
      <table class="skill-table">
        <thead>
          <tr>
            <th>스킬</th>
            <th>Self</th>
            <th>Lead</th>
            <th>GAP</th>
            <th>해석</th>
          </tr>
        </thead>
        <tbody>
          ${SKILLS.map(sk => {
            const sv = Number(d[`review-self-skills-${sk.key}`] || 0);
            const lv = Number(d[`review-lead-skills-${sk.key}`] || 0);
            const gap = sv - lv;
            const interp = gap > 1 ? '⚠️ 과대평가 경향' : gap < -1 ? '✅ 성장 여지 인식' : '✓ 합치';
            return `
              <tr>
                <td>${sk.label}</td>
                <td><span class="lv-chip lv-${sv}">${SKILL_LEVELS[sv]}</span></td>
                <td><span class="lv-chip lv-${lv}">${SKILL_LEVELS[lv]}</span></td>
                <td style="font-weight:700;color:${gap > 0 ? 'var(--gap-neg)' : gap < 0 ? 'var(--gap-pos)' : 'var(--text-muted)'}">${gap > 0 ? '+' : ''}${gap}</td>
                <td style="font-size:0.78rem;color:var(--text-muted)">${interp}</td>
              </tr>`;
          }).join('')}
        </tbody>
      </table>
      <div style="font-size:0.75rem;color:var(--text-muted);margin-top:12px">
        ⚠️ GAP +2↑: Self가 Lead보다 높게 평가 (과대평가 주의) · ✅ GAP -1↓: Lead가 더 높게 평가 (성장 기대)
      </div>
    </div>

    <!-- KPI -->
    <div class="section">
      <div class="section-title">🎯 KPI 달성 현황</div>
      <table class="kpi-table">
        <thead><tr><th>KPI 항목</th><th>목표</th><th>실적</th></tr></thead>
        <tbody>
          ${[1,2,3].map(i => d[`kpi-name-${i}`] ? `
            <tr>
              <td>${d[`kpi-name-${i}`]}</td>
              <td>${d[`kpi-target-${i}`] || '-'}</td>
              <td>${d[`kpi-actual-${i}`] || '-'}</td>
            </tr>` : '').join('')}
        </tbody>
      </table>
    </div>

    <!-- 종합 회고 -->
    <div class="section">
      <div class="section-title">📝 종합 회고</div>
      <div class="grid-2">
        ${[
          ['archive-capability', '역량 성장 스토리'],
          ['archive-initiative', '자기주도 이니셔티브'],
          ['archive-schedule', '일정 관리'],
          ['archive-collaboration', '팀 협업 기여'],
          ['archive-wins', '이달의 WIN 🏆'],
          ['archive-blocker', '블로커 & 배움'],
          ['archive-feedback', '팀에게 피드백'],
          ['archive-next', '다음 달 목표'],
        ].map(([key, label]) => `
          <div class="retro-block">
            <div class="retro-label">${label}</div>
            <div class="retro-text">${d[key] || '—'}</div>
          </div>`).join('')}
      </div>
      ${d['archive-evidence'] ? `
        <div class="retro-block" style="margin-top:8px">
          <div class="retro-label">성장 증거 자료</div>
          <div class="retro-text">${d['archive-evidence']}</div>
        </div>` : ''}
    </div>
  `;

  document.getElementById('mainContent').innerHTML = html;

  // 레이더 차트 렌더
  const ctx = document.getElementById('radarCanvas').getContext('2d');
  if (radarChart) radarChart.destroy();
  radarChart = new Chart(ctx, {
    type: 'radar',
    data: {
      labels: STATS.map(s => s.key),
      datasets: [
        {
          label: 'Self',
          data: STATS.map(s => Number(d[`review-self-stats-${s.key}`] || 0)),
          backgroundColor: 'rgba(108,99,255,0.15)',
          borderColor: '#6C63FF',
          pointBackgroundColor: '#6C63FF',
          pointRadius: 4,
        },
        {
          label: 'Lead',
          data: STATS.map(s => Number(d[`review-lead-stats-${s.key}`] || 0)),
          backgroundColor: 'rgba(255,101,132,0.1)',
          borderColor: '#FF6584',
          pointBackgroundColor: '#FF6584',
          pointRadius: 4,
        }
      ]
    },
    options: {
      plugins: { legend: { display: false } },
      scales: {
        r: {
          min: 0, max: 10,
          ticks: { stepSize: 2, color: '#8888AA', font: { size: 9 } },
          grid: { color: '#E0E0EE' },
          pointLabels: { font: { size: 10 }, color: '#555577' },
        }
      }
    }
  });
}

function renderAll(data) {
  if (data.length === 1) {
    renderSingleRecord(data[0]);
    return;
  }
  // 여러 레코드: 목록 카드 형태로 표시
  const html = data.map(d => {
    const selfAvg = STATS.reduce((s, st) => s + Number(d[`review-self-stats-${st.key}`] || 0), 0) / STATS.length;
    const leadAvg = STATS.reduce((s, st) => s + Number(d[`review-lead-stats-${st.key}`] || 0), 0) / STATS.length;
    const gap = selfAvg - leadAvg;
    return `
      <div class="section" style="cursor:pointer" onclick="renderSingleRecord(${JSON.stringify(d).replace(/</g,'&lt;')})">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
          <div>
            <div style="font-weight:700;font-size:1rem">${d['archive-member']} <span style="color:var(--text-muted);font-weight:400;font-size:0.85rem">· ${d['archive-month']}</span></div>
            <div style="font-size:0.8rem;color:var(--text-muted);margin-top:3px">작성자: ${d['archive-author']} · 업무강도: ${d['archive-workload']}</div>
          </div>
          <div style="display:flex;gap:12px;align-items:center">
            <div style="text-align:center">
              <div style="font-size:0.72rem;color:var(--text-muted)">Self 평균</div>
              <div style="font-size:1.2rem;font-weight:800;color:var(--self-color)">${selfAvg.toFixed(1)}</div>
            </div>
            <div style="text-align:center">
              <div style="font-size:0.72rem;color:var(--text-muted)">Lead 평균</div>
              <div style="font-size:1.2rem;font-weight:800;color:var(--lead-color)">${leadAvg.toFixed(1)}</div>
            </div>
            <div style="text-align:center">
              <div style="font-size:0.72rem;color:var(--text-muted)">GAP</div>
              <div style="font-size:1.2rem;font-weight:800;color:${Math.abs(gap) < 0.5 ? 'var(--text-muted)' : gap > 0 ? 'var(--gap-neg)' : 'var(--gap-pos)'}">${gap > 0 ? '+' : ''}${gap.toFixed(1)}</div>
            </div>
            <div style="color:var(--text-muted);font-size:1.2rem">›</div>
          </div>
        </div>
      </div>`;
  }).join('');
  document.getElementById('mainContent').innerHTML =
    `<div style="font-size:0.82rem;color:var(--text-muted);margin-bottom:12px">총 ${data.length}건 · 클릭하면 상세 비교를 볼 수 있습니다</div>` + html;
}
</script>
</body>
</html>
