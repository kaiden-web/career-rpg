<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마린 × 앰버 역량 비교</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --primary: #6C63FF;
    --primary-dark: #5a52d5;
    --accent: #FF6584;
    --success: #43D39E;
    --warning: #FFB347;
    --gold: #FFD700;
    --bg: #F5F5FA;
    --bg2: #EEEEF8;
    --bg3: #E8E8F5;
    --card: #FFFFFF;
    --border: #CCCCDD;
    --text: #1A1A2E;
    --text-muted: #555577;
    --marine-color: #6C63FF;
    --amber-color: #FF6584;
    --self-color: #6C63FF;
    --lead-color: #FF6584;
    --gap-pos: #43D39E;
    --gap-neg: #FF6584;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; min-height: 100vh; }

  /* ── Header ── */
  .header {
    background: linear-gradient(135deg, #1A1A2E, #2D2B55);
    padding: 24px 32px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
  }
  .header-left h1 { font-size: 1.3rem; color: #fff; font-weight: 700; }
  .header-left p { color: rgba(255,255,255,0.6); font-size: 0.82rem; margin-top: 3px; }
  .header-badges { display: flex; gap: 8px; flex-wrap: wrap; }
  .badge { padding: 4px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
  .badge-self { background: rgba(108,99,255,0.25); color: #a89fff; border: 1px solid rgba(108,99,255,0.4); }
  .badge-lead { background: rgba(255,101,132,0.2); color: #ff9aad; border: 1px solid rgba(255,101,132,0.4); }

  /* ── Layout ── */
  .container { max-width: 1100px; margin: 0 auto; padding: 28px 20px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  @media (max-width: 700px) {
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
  }

  /* ── Filter bar ── */
  .filter-bar {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 24px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .filter-bar label { font-size: 0.82rem; color: var(--text-muted); font-weight: 600; white-space: nowrap; }
  .filter-bar select, .filter-bar input {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.88rem;
    color: var(--text);
    background: var(--bg);
    min-width: 140px;
  }
  .filter-bar select:focus, .filter-bar input:focus { outline: 2px solid var(--primary); border-color: transparent; }
  .btn { padding: 9px 22px; border-radius: 8px; font-size: 0.88rem; font-weight: 700; cursor: pointer; border: none; transition: all .15s; }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-secondary { background: var(--bg2); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { background: var(--bg3); }

  /* ── Section card ── */
  .section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .section-title {
    font-size: 0.95rem; font-weight: 700; color: var(--primary);
    margin-bottom: 18px;
    padding-bottom: 12px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
  }
  .section-title .tag {
    margin-left: auto;
    font-size: 0.72rem; font-weight: 600;
    background: var(--bg2); color: var(--text-muted);
    padding: 3px 10px; border-radius: 10px;
  }

  /* ── Identity card (top info) ── */
  .identity-card {
    display: flex; flex-direction: column; gap: 8px;
  }
  .info-row { display: flex; gap: 8px; align-items: baseline; }
  .info-label { font-size: 0.75rem; color: var(--text-muted); min-width: 56px; }
  .info-value { font-size: 0.9rem; font-weight: 600; }
  .workload-chip {
    display: inline-block; padding: 2px 10px; border-radius: 10px;
    font-size: 0.78rem; font-weight: 700;
    background: var(--bg2); color: var(--primary);
  }

  /* ── Review text comparison ── */
  .review-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
  @media (max-width: 600px) { .review-pair { grid-template-columns: 1fr; } }
  .review-col { }
  .review-who {
    font-size: 0.75rem; font-weight: 700; margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot-self { background: var(--self-color); }
  .dot-lead { background: var(--lead-color); }
  .review-text {
    background: var(--bg);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 0.84rem;
    color: var(--text);
    line-height: 1.65;
    min-height: 60px;
    border: 1px solid var(--border);
  }
  .review-subhead {
    font-size: 0.78rem; font-weight: 700; color: var(--text-muted);
    margin: 14px 0 8px;
  }

  /* ── Stat comparison rows ── */
  .stat-compare-row {
    display: grid;
    grid-template-columns: 70px 1fr 52px 52px 52px;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    font-size: 0.85rem;
  }
  .stat-name { font-weight: 600; font-size: 0.82rem; color: var(--text-muted); }
  .bar-wrap { position: relative; height: 10px; background: var(--bg2); border-radius: 5px; overflow: visible; }
  .bar-self {
    height: 10px; border-radius: 5px 0 0 5px;
    background: linear-gradient(90deg, var(--self-color), #a89fff);
    position: absolute; top: 0; left: 0;
    transition: width .4s;
  }
  .bar-lead-line {
    position: absolute; top: -3px;
    width: 3px; height: 16px; border-radius: 2px;
    background: var(--lead-color);
    transition: left .4s;
  }
  .val-self { text-align: center; font-weight: 700; color: var(--self-color); }
  .val-lead { text-align: center; font-weight: 700; color: var(--lead-color); }
  .val-gap {
    text-align: center; font-weight: 700; font-size: 0.8rem;
    border-radius: 6px; padding: 2px 6px;
  }
  .gap-pos { color: var(--gap-pos); background: rgba(67,211,158,0.1); }
  .gap-neg { color: var(--gap-neg); background: rgba(255,101,132,0.1); }
  .gap-zero { color: var(--text-muted); background: var(--bg2); }

  /* ── Stat header ── */
  .stat-header {
    display: grid;
    grid-template-columns: 70px 1fr 52px 52px 52px;
    gap: 10px;
    margin-bottom: 10px;
    font-size: 0.72rem; color: var(--text-muted); font-weight: 600;
    text-align: center;
  }
  .stat-header .sh-left { text-align: left; }

  /* ── Skill comparison table ── */
  .skill-table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
  .skill-table th {
    background: var(--bg2); color: var(--text-muted);
    font-size: 0.75rem; font-weight: 700;
    padding: 8px 12px; text-align: left;
    border-bottom: 2px solid var(--border);
  }
  .skill-table th:not(:first-child) { text-align: center; }
  .skill-table td { padding: 9px 12px; border-bottom: 1px solid var(--bg2); }
  .skill-table td:not(:first-child) { text-align: center; }
  .skill-table tr:last-child td { border-bottom: none; }
  .lv-chip {
    display: inline-block;
    padding: 2px 10px; border-radius: 10px;
    font-size: 0.78rem; font-weight: 700;
  }
  .lv-0 { background: #f0f0f0; color: #999; }
  .lv-1 { background: #e8e8ff; color: #7070cc; }
  .lv-2 { background: #d0d0ff; color: #5050bb; }
  .lv-3 { background: #b8b0ff; color: #3a2e9c; }
  .lv-4 { background: rgba(108,99,255,0.25); color: #4a3fcc; }
  .lv-5 { background: var(--gold); color: #5a4000; }

  /* ── KPI table ── */
  .kpi-table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
  .kpi-table th {
    background: var(--bg2); color: var(--text-muted);
    font-size: 0.75rem; font-weight: 700;
    padding: 8px 12px; text-align: left;
    border-bottom: 2px solid var(--border);
  }
  .kpi-table td { padding: 9px 12px; border-bottom: 1px solid var(--bg2); }
  .kpi-table tr:last-child td { border-bottom: none; }

  /* ── Retro items ── */
  .retro-block { margin-bottom: 14px; }
  .retro-label {
    font-size: 0.75rem; font-weight: 700; color: var(--primary);
    margin-bottom: 5px;
  }
  .retro-text {
    background: var(--bg);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.84rem;
    line-height: 1.65;
    border: 1px solid var(--border);
    color: var(--text);
  }

  /* ── Radar chart ── */
  .chart-wrap { position: relative; width: 100%; max-width: 360px; margin: 0 auto; }
  .chart-legend { display: flex; justify-content: center; gap: 20px; margin-top: 10px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: var(--text-muted); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

  /* ── Summary score card ── */
  .score-cards { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }
  .score-card {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 18px;
    text-align: center; min-width: 100px;
  }
  .score-card .sc-label { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 4px; }
  .score-card .sc-value { font-size: 1.5rem; font-weight: 800; }
  .sc-self { color: var(--self-color); }
  .sc-lead { color: var(--lead-color); }
  .sc-gap { color: var(--text-muted); }

  /* ── State messages ── */
  .empty-state {
    text-align: center; padding: 50px 20px;
    color: var(--text-muted); font-size: 0.9rem;
  }
  .empty-state .emoji { font-size: 2.5rem; margin-bottom: 12px; }
  .loading {
    text-align: center; padding: 40px;
    color: var(--text-muted);
  }
  .error-msg {
    background: rgba(255,101,132,0.08);
    border: 1px solid rgba(255,101,132,0.3);
    border-radius: 8px; padding: 14px 18px;
    color: var(--accent); font-size: 0.85rem;
    margin-bottom: 16px;
  }

  /* ── Month chip selector ── */
  .month-chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .month-chip {
    padding: 5px 14px; border-radius: 20px;
    font-size: 0.8rem; font-weight: 600;
    background: var(--bg2); color: var(--text-muted);
    cursor: pointer; border: 1px solid var(--border);
    transition: all .15s;
  }
  .month-chip.active {
    background: var(--primary); color: white; border-color: var(--primary);
  }

  /* ── Side-by-side compare layout ── */
  .compare-header {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 20px;
  }
  .member-card {
    border-radius: 14px;
    padding: 20px 24px;
    border: 2px solid;
  }
  .member-card.marine {
    background: rgba(108,99,255,0.05);
    border-color: rgba(108,99,255,0.3);
  }
  .member-card.amber {
    background: rgba(255,101,132,0.05);
    border-color: rgba(255,101,132,0.3);
  }
  .member-name {
    font-size: 1.1rem; font-weight: 800; margin-bottom: 4px;
  }
  .member-name.marine { color: var(--marine-color); }
  .member-name.amber { color: var(--amber-color); }
  .member-sub { font-size: 0.8rem; color: var(--text-muted); }

  /* ── Compare stat rows (marine | stat | amber) ── */
  .stat-vs-row {
    display: grid;
    grid-template-columns: 60px 1fr 60px 1fr 60px;
    align-items: center;
    gap: 6px;
    margin-bottom: 12px;
    font-size: 0.85rem;
  }
  .stat-vs-name {
    text-align: center;
    font-weight: 700; font-size: 0.78rem;
    color: var(--text-muted);
    padding: 3px 6px;
    background: var(--bg2);
    border-radius: 6px;
  }
  .stat-vs-val {
    font-weight: 800; font-size: 1.1rem;
    text-align: center;
  }
  .stat-vs-val.marine { color: var(--marine-color); }
  .stat-vs-val.amber { color: var(--amber-color); }
  .bar-vs {
    height: 10px; border-radius: 5px; background: var(--bg2);
    position: relative; overflow: hidden;
  }
  .bar-vs-fill {
    height: 100%; border-radius: 5px;
    transition: width .4s;
  }
  .bar-vs-fill.marine {
    background: linear-gradient(90deg, var(--marine-color), #a89fff);
    float: right;
  }
  .bar-vs-fill.amber {
    background: linear-gradient(90deg, #ff9aad, var(--amber-color));
  }

  /* ── Skill compare table (2-person) ── */
  .skill-vs-table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
  .skill-vs-table th {
    background: var(--bg2); color: var(--text-muted);
    font-size: 0.75rem; font-weight: 700;
    padding: 8px 12px; text-align: center;
    border-bottom: 2px solid var(--border);
  }
  .skill-vs-table th:first-child { text-align: left; }
  .skill-vs-table td { padding: 9px 12px; border-bottom: 1px solid var(--bg2); text-align: center; }
  .skill-vs-table td:first-child { text-align: left; font-weight: 600; }
  .skill-vs-table tr:last-child td { border-bottom: none; }

  /* ── Text compare 2-col ── */
  .text-compare-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 12px;
  }
  .text-col-header {
    font-size: 0.75rem; font-weight: 700; margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .text-col-header.marine { color: var(--marine-color); }
  .text-col-header.amber { color: var(--amber-color); }

  @media (max-width: 700px) {
    .compare-header, .text-compare-grid { grid-template-columns: 1fr; }
    .stat-vs-row { grid-template-columns: 50px 1fr 50px 1fr 50px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>⚔️ 마린 × 앰버 역량 비교</h1>
    <p>Self 리뷰 × Lead 리뷰 나란히 분석 · 마케팅팀</p>
  </div>
  <div class="header-badges">
    <span class="badge badge-self">● 마린</span>
    <span class="badge badge-lead">● 앰버</span>
  </div>
</div>

<div class="container">

  <!-- Filter bar -->
  <div class="filter-bar">
    <label>기준월</label>
    <select id="filterMonth">
      <option value="">월 선택</option>
    </select>
    <button class="btn btn-primary" onclick="loadData()">🔄 불러오기</button>
    <button class="btn btn-secondary" onclick="resetFilter()">초기화</button>
    <span id="statusMsg" style="margin-left:auto;font-size:0.8rem;color:var(--text-muted);"></span>
  </div>

  <!-- Main content -->
  <div id="mainContent">
    <div class="empty-state">
      <div class="emoji">📊</div>
      <div>기준월을 선택하고 <strong>불러오기</strong>를 눌러주세요</div>
      <div style="margin-top:8px;font-size:0.8rem">마린과 앰버의 역량 회고를 나란히 비교합니다</div>
    </div>
  </div>

</div>

<script>
// ─────────────────────────────────────────────
// 마린 × 앰버 역량 비교 — 2026-10 실제 데이터
// 마린 자기평가 vs 앰버(리드)의 마린 평가
// ─────────────────────────────────────────────

const STATS = [
  { key: 'STR', label: '실행력 STR' },
  { key: 'AGI', label: '민첩성 AGI' },
  { key: 'SEN', label: '감수성 SEN' },
  { key: 'INT', label: '분석력 INT' },
  { key: 'CHA', label: '소통력 CHA' },
  { key: 'STA', label: '지속력 STA' },
];

const SKILLS = [
  { key: 's1', label: 'AI 마케팅 툴 활용' },
  { key: 's2', label: '수익 구조 이해' },
  { key: 's3', label: '프로모션 기획' },
  { key: 's4', label: '매체 운영' },
  { key: 's5', label: '데이터 시각화' },
  { key: 's6', label: '콘텐츠 제작' },
  { key: 's7', label: 'CRM 운영' },
  { key: 's8', label: '브랜드 캠페인' },
];

const SKILL_LEVELS = ['Lv.0 모름', 'Lv.1 개념이해', 'Lv.2 보조수행', 'Lv.3 단독수행', 'Lv.4 최적화', 'Lv.5 가르침'];

// ── 실제 이메일 데이터 (2026-10) ──
const REVIEW_DATA = {
  '2026-10': {
    month: '2026-10',
    marine: {
      name: '마린',
      role: 'Self 평가',
      stats: { STR: 8, AGI: 8, SEN: 9, INT: 6, CHA: 7, STA: 8 },
      skills: { s1: 4, s2: 2, s3: 2, s4: 4, s5: 4, s6: 5, s7: 1, s8: 1 },
      strength: '1. 얼리블프와 상시 메타 광고를 함께 운영하면서 효율이 떨어지는 구간과 디벨롭이 필요한 소재를 구체적으로 정리한 점\n2. 메타 소재 효율 대시보드, 카카오 플친 대시보드 등을 만들어 이후 회고와 운영 판단에 필요한 데이터를 한 화면에서 확인할 수 있도록 개선하여 업무 단순화 시킨 점\n3. 소재별 ROAS·CTR·구매·지출을 기준으로 고효율 소재와 저효율 소재를 나누고 어떤 후킹 요소·소구점을 유지하거나 바꿔야 하는지 다음 액션까지 빠르게 연결한 점',
      growth: '콘텐츠 기획과 효율 분석에 그치지 않고 분석 결과를 토대로 실제 매출 개선 액션까지 연결하는 역량을 키우고 싶다. 또한 규모가 작은 프로모션부터 직접 담당해 목표 설정부터 콘텐츠·매체 운영, 일정 관리, 성과 분석까지 전체 흐름을 경험하며 주도적으로 운영할 수 있는 단계로 성장하는 것이 목표.',
      wins: '반복적으로 발생하던 소재 성과 확인과 회고 자료 정리 소요 시간을 줄이기 위해 메타 소재 효율 대시보드·카카오 플친 대시보드·회고 대시보드를 제작했고 자동화 세팅 시트도 생성.',
      blocker: '1. 얼리블프 기간에는 광고 세팅, 소재 효율 확인 및 공유, 추가 소재 기획 등 업무가 동시에 몰리면서 메타 운영에 집중하지 못한 점\n2. 신규 소재는 주기적으로 추가가 되는데 효율을 지속적으로 트래킹하지 못한 점',
      next: '1. 월간 업무 타임라인을 활용해 업무 일정과 진행 상태를 체계적으로 관리\n2. 메타 운영 확실한 정립 필요 — 상품 1개 선택 → 구매 이유 2-3개 정의 → 상황별 후킹 기획',
      evidence: '회고 대시보드: https://nollo-october-retrospective-20261029.cys8904.chatgpt.site/\n메타 소재 효율 대시보드: https://nollo-meta-creative-share-20261022.sp-mkt-7428.chatgpt.site/\n카카오 플친 효율 대시보드: https://nollo-kakao-friendtalk-20261022.cys8904.chatgpt.site/',

      strength: '· 데이터 분석 자동화 대시보드 정리 — 회의 준비에 시간 사용이 제일 많았던 부분, 10월 중 자동화 계획(9월 회고 당시) 미션 완료!\n· 메타 캠페인 운영 시 본인의 시각으로 분석 & 실행',
      growth: '· 자기 주도적 업무 우선순위 판단 및 효율적 운영\n· 깊이 있는 분석 능력 향상 필요\n· 업무 우선순위/중요도 고려하기\n· 업무의 목적("왜")에 대해 궁금해 하기 → 그래야 목적 달성을 위한 목표 설정 및 HOW를 능동적으로 잡을 수 있음',
      wins: '· 데이터 분석 자동화 대시보드 정리\n· 광고 효율 관리 AI 자동화',
      blocker: '· 일자별 메타 광고비 비효율적 운영 — 메타 회신을 기다리며 저효율 캠페인 유지\n· 블프 캠페인 OFF 되지 않아 다음날 오전까지 라이브',
      next: '· 놀로데이 단독 기획 및 운영\n· 메타 외 전체 광고 채널 컨트롤',
      feedback: '· 자기 주도적 업무 우선순위 판단 및 효율적 운영\n· 깊이 있는 분석 능력 향상 필요',

};

let radarChart = null;

window.onload = function() {
  const moSel = document.getElementById('filterMonth');
  Object.keys(REVIEW_DATA).sort().reverse().forEach(m => {
    const opt = document.createElement('option');
    opt.value = m; opt.textContent = m;
    moSel.appendChild(opt);
  });
  // 기본값: 2026-10 자동 로드
  moSel.value = '2026-10';
  loadData();
};

function setStatus(msg) {
  document.getElementById('statusMsg').textContent = msg;
}

function resetFilter() {
  document.getElementById('filterMonth').value = '';
  document.getElementById('mainContent').innerHTML = `
    <div class="empty-state">
      <div class="emoji">📊</div>
      <div>기준월을 선택하고 <strong>불러오기</strong>를 눌러주세요</div>
    </div>`;
  setStatus('');
}

function loadData() {
  const month = document.getElementById('filterMonth').value;
  if (!month || !REVIEW_DATA[month]) {
    document.getElementById('mainContent').innerHTML = `
      <div class="empty-state">
        <div class="emoji">🔍</div>
        <div>해당 월의 데이터가 없습니다</div>
      </div>`;
    return;
  }
  renderComparison(REVIEW_DATA[month]);
  setStatus(`${month} 데이터 로드됨`);
}

// ── 스코어 평균 계산 ──
function statsAvg(stats) {
  const vals = Object.values(stats);
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}

// ── 별점 HTML ──
function scoreBar(val, cls) {
  const pct = (val / 10) * 100;
  return `<div class="bar-vs"><div class="bar-vs-fill ${cls}" style="width:${pct}%"></div></div>`;
}

// ── 줄바꿈 처리 ──
function nl2br(str) {
  return (str || '—').replace(/\n/g, '<br>');
}

// ── 메인 비교 렌더 ──
function renderComparison(data) {
  const m = data.marine, a = data.amber;
  const mAvg = statsAvg(m.stats), aAvg = statsAvg(a.stats);

  const scoreLabels = [
    { key: 'capability', label: '역량 성장' },
    { key: 'initiative', label: '이니셔티브' },
    { key: 'schedule',   label: '일정 관리' },
    { key: 'collaboration', label: '팀 협업' },
  ];

  const html = `
  <!-- 상단 인물 카드 -->
  <div class="compare-header">
    <div class="member-card marine">
      <div class="member-name marine">🟣 ${m.name}</div>
      <div style="font-size:0.78rem;color:var(--text-muted);margin-bottom:10px">${m.role} · ${data.month}</div>
      <div style="display:flex;gap:16px">
        <div style="text-align:center">
          <div style="font-size:0.7rem;color:var(--text-muted)">스탯 평균</div>
          <div style="font-size:1.8rem;font-weight:900;color:var(--marine-color)">${mAvg.toFixed(1)}</div>
        </div>
        <div style="flex:1">
          ${scoreLabels.map(sl => `
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:0.75rem">
              <span style="width:56px;color:var(--text-muted)">${sl.label}</span>
              <div class="bar-vs" style="flex:1"><div class="bar-vs-fill marine" style="width:${m.scores[sl.key]*10}%"></div></div>
              <span style="width:16px;text-align:right;font-weight:700;color:var(--marine-color)">${m.scores[sl.key]}</span>
            </div>`).join('')}
        </div>
      </div>
    </div>
    <div class="member-card amber">
      <div class="member-name amber">🩷 ${a.name}</div>
      <div style="font-size:0.78rem;color:var(--text-muted);margin-bottom:10px">${a.role} · ${data.month}</div>
      <div style="display:flex;gap:16px">
        <div style="text-align:center">
          <div style="font-size:0.7rem;color:var(--text-muted)">스탯 평균</div>
          <div style="font-size:1.8rem;font-weight:900;color:var(--amber-color)">${aAvg.toFixed(1)}</div>
        </div>
        <div style="flex:1">
          ${scoreLabels.map(sl => `
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:0.75rem">
              <span style="width:56px;color:var(--text-muted)">${sl.label}</span>
              <div class="bar-vs" style="flex:1"><div class="bar-vs-fill amber" style="width:${a.scores[sl.key]*10}%"></div></div>
              <span style="width:16px;text-align:right;font-weight:700;color:var(--amber-color)">${a.scores[sl.key]}</span>
            </div>`).join('')}
        </div>
      </div>
    </div>
  </div>

  <!-- 6대 스탯 레이더 + VS 바 -->
  <div class="section">
    <div class="section-title">⚔️ 6대 스탯 비교</div>
    <div class="grid-2" style="align-items:start;gap:20px">
      <div>
        <!-- VS 바 -->
        <div style="font-size:0.72rem;color:var(--text-muted);margin-bottom:8px;display:flex;gap:16px">
          <span>🟣 마린 Self</span><span>🩷 앰버 리드 평가</span>
        </div>
        ${STATS.map(st => {
          const mv = m.stats[st.key], av = a.stats[st.key];
          const gap = mv - av;
          const gapCol = gap > 0 ? 'var(--marine-color)' : gap < 0 ? 'var(--amber-color)' : 'var(--text-muted)';
          return `
          <div class="stat-vs-row" style="display:grid;grid-template-columns:60px 1fr 44px 1fr 44px;align-items:center;gap:6px;margin-bottom:10px">
            <div class="stat-vs-val marine">${mv}</div>
            <div class="bar-vs"><div class="bar-vs-fill marine" style="width:${mv*10}%"></div></div>
            <div style="text-align:center;font-weight:700;font-size:0.82rem">${st.key}</div>
            <div class="bar-vs"><div class="bar-vs-fill amber" style="width:${av*10}%"></div></div>
            <div class="stat-vs-val amber">${av}</div>
          </div>`;
        }).join('')}
        <div style="font-size:0.72rem;color:var(--text-muted);margin-top:4px">
          * 마린 자기평가 vs 앰버 리드평가 — 기준이 다를 수 있으므로 GAP은 참고용
        </div>
      </div>
      <div>
        <div class="chart-wrap">
          <canvas id="radarCanvas" width="300" height="260"></canvas>
        </div>
        <div class="chart-legend" style="justify-content:center;gap:20px">
          <div class="legend-item"><div class="legend-dot" style="background:var(--marine-color)"></div>마린 Self</div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--amber-color)"></div>앰버 리드</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 스킬 비교 테이블 -->
  <div class="section">
    <div class="section-title">🛠️ 스킬 레벨 비교</div>
    <table class="skill-vs-table">
      <thead>
        <tr>
          <th>스킬</th>
          <th style="color:var(--marine-color)">🟣 마린 Self</th>
          <th style="color:var(--amber-color)">🩷 앰버 리드</th>
          <th>차이</th>
        </tr>
      </thead>
      <tbody>
        ${SKILLS.map(sk => {
          const mv = m.skills[sk.key], av = a.skills[sk.key];
          const gap = mv - av;
          const gapStr = gap > 0 ? `+${gap}` : `${gap}`;
          const gapCol = gap > 1 ? '#FF6584' : gap < -1 ? '#22CC88' : 'var(--text-muted)';
          return `
          <tr>
            <td>${sk.label}</td>
            <td><span class="lv-chip lv-${mv}">${SKILL_LEVELS[mv]}</span></td>
            <td><span class="lv-chip lv-${av}">${SKILL_LEVELS[av]}</span></td>
            <td style="font-weight:700;color:${gapCol}">${gapStr}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
    <div style="font-size:0.74rem;color:var(--text-muted);margin-top:10px">
      +값: 마린이 자신을 더 높게 평가 · -값: 앰버 리드가 더 높게 평가
    </div>
  </div>

  <!-- 서로의 시선 비교 -->
  <div class="section">
    <div class="section-title">🪞 서로의 시선 — 강점</div>
    <div class="text-compare-grid">
      <div>
        <div class="text-col-header marine">🟣 마린 자기평가</div>
        <div class="retro-text">${nl2br(m.strength)}</div>
      </div>
      <div>
        <div class="text-col-header amber">🩷 앰버 리드 평가</div>
        <div class="retro-text">${nl2br(a.strength)}</div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">🌱 성장 포인트</div>
    <div class="text-compare-grid">
      <div>
        <div class="text-col-header marine">🟣 마린 스스로</div>
        <div class="retro-text">${nl2br(m.growth)}</div>
      </div>
      <div>
        <div class="text-col-header amber">🩷 앰버 관점</div>
        <div class="retro-text">${nl2br(a.growth)}</div>
      </div>
    </div>
  </div>

  <!-- 이달의 WIN + 블로커 -->
  <div class="section">
    <div class="section-title">🏆 이달의 WIN</div>
    <div class="text-compare-grid">
      <div>
        <div class="text-col-header marine">🟣 마린</div>
        <div class="retro-text">${nl2br(m.wins)}</div>
      </div>
      <div>
        <div class="text-col-header amber">🩷 앰버</div>
        <div class="retro-text">${nl2br(a.wins)}</div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">🧱 블로커</div>
    <div class="text-compare-grid">
      <div>
        <div class="text-col-header marine">🟣 마린</div>
        <div class="retro-text">${nl2br(m.blocker)}</div>
      </div>
      <div>
        <div class="text-col-header amber">🩷 앰버</div>
        <div class="retro-text">${nl2br(a.blocker)}</div>
      </div>
    </div>
  </div>

  <!-- 다음 달 목표 -->
  <div class="section">
    <div class="section-title">🎯 다음 달 목표</div>
    <div class="text-compare-grid">
      <div>
        <div class="text-col-header marine">🟣 마린 목표</div>
        <div class="retro-text">${nl2br(m.next)}</div>
      </div>
      <div>
        <div class="text-col-header amber">🩷 앰버 → 마린 목표</div>
        <div class="retro-text">${nl2br(a.next)}</div>
      </div>
    </div>
  </div>

  <!-- 마린 증거자료 -->
  <div class="section">
    <div class="section-title">📎 성장 증거자료 (마린)</div>
    <div class="retro-text">${nl2br(m.evidence)}</div>
  </div>
  `;

  document.getElementById('mainContent').innerHTML = html;

  // 레이더 차트
  const ctx = document.getElementById('radarCanvas').getContext('2d');
  if (radarChart) radarChart.destroy();
  radarChart = new Chart(ctx, {
    type: 'radar',
    data: {
      labels: STATS.map(s => s.key),
      datasets: [
        {
          label: '마린 Self',
          data: STATS.map(s => m.stats[s.key]),
          backgroundColor: 'rgba(108,99,255,0.15)',
          borderColor: '#6C63FF',
          pointBackgroundColor: '#6C63FF',
          pointRadius: 4, borderWidth: 2,
        },
        {
          label: '앰버 리드',
          data: STATS.map(s => a.stats[s.key]),
          backgroundColor: 'rgba(255,101,132,0.1)',
          borderColor: '#FF6584',
          pointBackgroundColor: '#FF6584',
          pointRadius: 4, borderWidth: 2,
        }
      ]
    },
    options: {
      plugins: { legend: { display: false } },
      scales: {
        r: {
          min: 0, max: 10,
          ticks: { stepSize: 2, color: '#8888AA', font: { size: 9 } },
          grid: { color: '#E0E0EE' },
          pointLabels: { font: { size: 11, weight: '700' }, color: '#555577' },
        }
      }
    }
  });
}
</script>
</body>
</html>
